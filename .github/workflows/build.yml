# Every push to main: test, build and push ghcr.io/kthaisociety/onboarding-service:sha-<7>, then deploy
# it to staging through kthaisociety/deployments, and wait until it runs there. release.yml waits for this
# workflow's run of a release commit (so a release is promoted only after it ran on staging): the two stay
# separate files.
name: build

on:
  push:
    branches: [main]

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...

  build:
    needs: test
    uses: kthaisociety/workflows/.github/workflows/build.yml@v0.2.0
    permissions:
      contents: read
      packages: write

  deploy-staging:
    needs: build
    uses: kthaisociety/workflows/.github/workflows/request-deploy.yml@v0.2.0
    with:
      environment: staging
      tag: ${{ needs.build.outputs.tag }}
    secrets:
      dispatch-app-client-id: ${{ secrets.DISPATCH_APP_CLIENT_ID }}
      dispatch-app-private-key: ${{ secrets.DISPATCH_APP_PRIVATE_KEY }}
